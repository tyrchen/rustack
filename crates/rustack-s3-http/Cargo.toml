[package]
name = "rustack-s3-http"
description = "S3 HTTP routing, request parsing, response serialization, and hyper service for Rustack"
version = "0.10.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustack-core = { workspace = true }
rustack-s3-core = { workspace = true }
rustack-s3-model = { workspace = true }
rustack-auth = { workspace = true }
rustack-s3-xml = { workspace = true }

hyper = { version = "1.11", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
http = "1.5"
http-body = "1.1"
http-body-util = "0.1"
bytes = "1.12"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "sync", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2.3"
tracing = "0.1"
thiserror = "2.0"
futures = "0.3"
pin-project-lite = "0.2"
uuid = { version = "1.26", features = ["v4"] }
mime = "0.3"
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
