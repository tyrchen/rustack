[package]
name = "rustack-lambda-core"
description = "Lambda business logic for Rustack"
version = "0.11.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustack-core = { workspace = true }
rustack-lambda-model = { workspace = true }
rustack-lambda-http = { workspace = true }
rustack-lambda-runtime = { workspace = true }
rustack-auth = { workspace = true }
squib = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
bollard-stubs = { workspace = true }
percent-encoding = { workspace = true }
form_urlencoded = { workspace = true }
typed-builder = { workspace = true }
winnow = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
