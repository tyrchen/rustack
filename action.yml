name: "Rustack"
description: "Start a high-performance AWS-compatible server (S3, DynamoDB, Lambda and Step Functions) on localhost:4566 (drop-in replacement for LocalStack)"
author: "Tyr Chen"

branding:
  icon: "database"
  color: "orange"

inputs:
  image-tag:
    description: "Docker image tag to use"
    required: false
    default: "latest"
  port:
    description: "Host port to bind the service to"
    required: false
    default: "4566"
  default-region:
    description: "Default AWS region"
    required: false
    default: "us-east-1"
  log-level:
    description: "Log level (error, warn, info, debug, trace)"
    required: false
    default: "info"
  wait-timeout:
    description: "Seconds to wait for the service to become healthy"
    required: false
    default: "30"
  access-key:
    description: "AWS access key (empty pair omits credentials; enabled strict services require a pair)"
    required: false
    default: "test"
  secret-key:
    description: "AWS secret key (empty pair omits credentials; skip-auth flags still govern)"
    required: false
    default: "test"
  s3-skip-auth:
    description: "Skip S3 signature validation (true/false)"
    required: false
    default: "true"
  dynamodb-skip-auth:
    description: "Skip DynamoDB signature validation (true/false)"
    required: false
    default: "true"
  sqs-skip-auth:
    description: "Skip SQS signature validation (true/false)"
    required: false
    default: "true"
  ssm-skip-auth:
    description: "Skip SSM signature validation (true/false)"
    required: false
    default: "true"
  sns-skip-auth:
    description: "Skip SNS signature validation (true/false)"
    required: false
    default: "true"
  lambda-skip-auth:
    description: "Skip Lambda signature validation (true/false)"
    required: false
    default: "true"
  stepfunctions-skip-auth:
    description: "Skip Step Functions signature validation (true/false)"
    required: false
    default: "true"
  persistence:
    description: "Enable durable storage persistence (true/false)"
    required: false
    default: "false"
  services:
    description: "Comma-separated list of services to enable (empty = all compiled-in services)"
    required: false
    default: ""

outputs:
  endpoint:
    description: "The service endpoint URL (used as AWS_ENDPOINT_URL for S3, DynamoDB, SQS, SSM, SNS, and Lambda)"
    value: ${{ steps.start.outputs.endpoint }}
  container-id:
    description: "The Docker container ID (for advanced usage)"
    value: ${{ steps.start.outputs.container_id }}

runs:
  using: "composite"
  steps:
    - name: Validate, start and qualify Rustack
      id: start
      shell: bash
      env:
        RUSTACK_ACTION_ROOT: ${{ github.action_path }}
        RUSTACK_ACTION_IMAGE_TAG: ${{ inputs.image-tag }}
        RUSTACK_ACTION_PORT: ${{ inputs.port }}
        RUSTACK_ACTION_DEFAULT_REGION: ${{ inputs.default-region }}
        RUSTACK_ACTION_LOG_LEVEL: ${{ inputs.log-level }}
        RUSTACK_ACTION_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        RUSTACK_ACTION_ACCESS_KEY: ${{ inputs.access-key }}
        RUSTACK_ACTION_SECRET_KEY: ${{ inputs.secret-key }}
        RUSTACK_ACTION_PERSISTENCE: ${{ inputs.persistence }}
        RUSTACK_ACTION_SERVICES: ${{ inputs.services }}
        RUSTACK_ACTION_S3_SKIP_AUTH: ${{ inputs.s3-skip-auth }}
        RUSTACK_ACTION_DYNAMODB_SKIP_AUTH: ${{ inputs.dynamodb-skip-auth }}
        RUSTACK_ACTION_SQS_SKIP_AUTH: ${{ inputs.sqs-skip-auth }}
        RUSTACK_ACTION_SSM_SKIP_AUTH: ${{ inputs.ssm-skip-auth }}
        RUSTACK_ACTION_SNS_SKIP_AUTH: ${{ inputs.sns-skip-auth }}
        RUSTACK_ACTION_LAMBDA_SKIP_AUTH: ${{ inputs.lambda-skip-auth }}
        RUSTACK_ACTION_STEPFUNCTIONS_SKIP_AUTH: ${{ inputs.stepfunctions-skip-auth }}
      run: exec python3 -B "$RUSTACK_ACTION_ROOT/tools/github-action/runtime.py"
