name: pulumi-test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulumi-smoke:
    name: Service and Pulumi smoke
    runs-on: ubuntu-latest
    env:
      RUSTACK_PID_FILE: ${{ github.workspace }}/rustack-smoke.pid
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/pulumi/rustack-target/package-lock.json

      - name: Install Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.243.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Run recent-change regressions
        run: make smoke-regressions

      - name: Run Pulumi smoke
        env:
          RUSTACK_KEEP_RUNNING: "1"
        run: make pulumi-smoke

      - name: Run service functional smoke
        run: make smoke-services

      - name: Stop smoke server
        if: always()
        run: |
          if [[ -f "$RUSTACK_PID_FILE" ]]; then
            kill -INT "$(cat "$RUSTACK_PID_FILE")" 2>/dev/null || true
          fi
