name: promote-docker

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful same-commit release-docker candidate run
        required: true
        type: string
      qualification_run_id:
        description: Successful same-commit qualify-workflows run
        required: true
        type: string
      version:
        description: Numeric major.minor.patch version to promote
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rustack-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.qualification_run_id }}
          name: workflows-qualified-release
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualification
      - name: Recheck raw qualification before registry login
        run: |
          make release-promotion-check
          make workflows-release-preflight WORKFLOWS_RELEASE_BUNDLE="${{ runner.temp }}/qualification"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the qualified archives without rebuilding
        run: make workflows-release-promote WORKFLOWS_RELEASE_BUNDLE="${{ runner.temp }}/qualification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-promotion-receipt
          path: ${{ runner.temp }}/qualification/promotion.json
          if-no-files-found: error

  action-release:
    needs: promote
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the actual Action against the promoted image
        uses: ./
        with:
          image-tag: ${{ inputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workflows-promotion-receipt
          path: ${{ runner.temp }}/promotion
      - name: Bind the running Action container to the promotion receipt
        env:
          RUSTACK_PROMOTION_RECEIPT: ${{ runner.temp }}/promotion/promotion.json
        run: make release-promoted-image
      - name: Update Action major and minor aliases on the promoted commit
        run: make release-action-aliases
      - name: Cleanup Action container
        if: always()
        run: docker rm -f rustack 2>/dev/null || true
