name: release-docker

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# Candidates are local Docker archives. Publication belongs to promote-docker.
permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Allocate candidate directory
        run: mkdir -m 700 "${{ runner.temp }}/candidate"
      - name: Build without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          push: false
          provenance: false
          tags: rustack/workflows-release:integration-${{ matrix.architecture }}
          outputs: type=docker,dest=${{ runner.temp }}/candidate/release-${{ matrix.architecture }}.tar
          cache-from: type=gha,scope=release-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.architecture }}
      - name: Load and seal exact archive
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          CANDIDATE: ${{ runner.temp }}/candidate
        run: |
          docker image load --input "$CANDIDATE/release-$ARCHITECTURE.tar"
          make workflows-release-seal WORKFLOWS_ARCH="$ARCHITECTURE" WORKFLOWS_RELEASE_BUNDLE="$CANDIDATE"
      - name: Record execution scope
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [ "$ARCHITECTURE" = amd64 ]; then
            echo 'D100: distribution build only; Linux x86_64 execution is waived.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Candidate awaits complete exact-image platform qualification; no promotion occurred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ matrix.architecture }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
