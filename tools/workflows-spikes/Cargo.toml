[package]
name = "rustack-workflows-spikes"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
bytes = { version = "1.12", features = ["serde"] }
ciborium = "0.2"
futures = "0.3"
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std"] }
uuid = { version = "1.26", features = ["v4"] }

[lints.rust]
rust_2024_compatibility = "warn"
missing_docs = "warn"
missing_debug_implementations = "warn"
